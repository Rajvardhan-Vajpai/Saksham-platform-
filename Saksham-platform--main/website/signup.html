<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign up — Saksham</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header class="site-header"><div class="container">
  <a href="index.html" class="brand" style="text-decoration:none;">
    <div class="brand-emblem">SK</div>
    <div class="brand-text"><div class="brand-name">Saksham</div><div class="brand-sub">National Training &amp; Competency Platform</div></div>
  </a>
  <a href="index.html" class="btn btn-ghost btn-sm">← Back to home</a>
</div></header>
<div class="tricolor-rule"></div>

<div class="auth-shell">
  <div class="auth-card" style="max-width:440px;">

    <div id="roleStep">
      <h1>Create your account</h1>
      <p class="sub">Trainer accounts are reviewed by an administrator before they're activated.</p>
      <div class="field">
        <label>I am signing up as</label>
        <div class="role-select">
          <label><input type="radio" name="role" value="trainee" checked><span>Trainee</span></label>
          <label><input type="radio" name="role" value="trainer"><span>Trainer</span></label>
        </div>
      </div>
      <button class="btn btn-primary btn-block" id="continueBtn">Continue</button>
      <p class="auth-foot">Already registered? <a href="login.html">Log in</a></p>
    </div>

    <div id="clerkStep" style="display:none;">
      <div id="statusBox"></div>
      <div id="clerk-signup"></div>
    </div>

  </div>
</div>

<script src="assets/js/clerk-auth.js"></script>
<script src="assets/js/api.js"></script>

<script src="assets/js/signup.js"></script>
</body>
</html>
