<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Approvals — Saksham</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<div class="app-shell">
  <aside class="app-sidebar" id="sidebar"></aside>
  <div class="app-main">
    <div class="app-topbar" id="topbar"></div>
    <div class="app-content">

      <div class="card card-pad" style="margin-bottom:20px;display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:space-between;">
        <input type="search" id="searchBox" placeholder="Search by name or email" style="max-width:280px;">
        <div style="display:flex;gap:8px;">
          <select id="statusFilter">
            <option value="">All statuses</option>
            <option value="pending">Pending</option>
            <option value="approved">Approved</option>
            <option value="rejected">Rejected</option>
          </select>
          <select id="roleFilter">
            <option value="">All roles</option>
            <option value="trainee">Trainee</option>
            <option value="trainer">Trainer</option>
          </select>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Department</th><th>Applied</th><th>Status</th><th>Action</th></tr></thead>
          <tbody id="userTable"></tbody>
        </table>
      </div>

    </div>
  </div>
</div>

<script src="../assets/js/clerk-auth.js"></script>
<script src="../assets/js/mock-data.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/layout.js"></script>

<script src="../assets/js/admin-users.js"></script>
</body>
</html>
