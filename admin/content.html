<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homepage Content — Saksham</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<div class="app-shell">
  <aside class="app-sidebar" id="sidebar"></aside>
  <div class="app-main">
    <div class="app-topbar" id="topbar"></div>
    <div class="app-content">

      <div class="grid-2" style="grid-template-columns:1fr 1.2fr;align-items:start;">
        <form class="card card-pad" id="publishForm">
          <h3 style="font-size:15px;">Publish to homepage</h3>
          <div class="field"><label>Type</label>
            <select id="itemType">
              <option value="New content">New content</option>
              <option value="Notice">Notification</option>
              <option value="Achievement">Achievement</option>
            </select>
          </div>
          <div class="field"><label>Title</label><input type="text" id="itemTitle" placeholder="e.g. New course launched: ..." required></div>
          <div class="field"><label>Description</label><textarea id="itemBody" placeholder="One or two sentences shown on the homepage" required></textarea></div>
          <button type="submit" class="btn btn-primary btn-block">Publish</button>
        </form>

        <div>
          <div class="section-head"><h2 style="font-size:16px;">Currently on the homepage</h2></div>
          <div class="grid-2" id="itemGrid" style="grid-template-columns:1fr;gap:14px;"></div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="../assets/js/clerk-auth.js"></script>
<script src="../assets/js/mock-data.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/layout.js"></script>
<script>
  initDashboardShell({ role: "admin", active: "content.html", title: "Homepage Content", crumb: "Admin console", userName: "Programme Admin" });

  let items = [];
  const tagClass = t => t === "Achievement" ? "tag-achieve" : (t === "New content" ? "tag-new" : "tag-info");

  function render() {
    itemGrid.innerHTML = items.map((n, i) => `
      <div class="notice-card">
        <div class="notice-date"><div class="d">${n.date.split(" ")[0]}</div><div class="m">${n.date.split(" ")[1]}</div></div>
        <div class="notice-body" style="flex:1;">
          <span class="tag ${tagClass(n.tag)}">${n.tag}</span>
          <h4 style="margin-top:6px;">${n.title}</h4>
          <p style="margin:0;">${n.body}</p>
        </div>
        <button class="btn btn-ghost btn-sm" data-remove="${i}">Remove</button>
      </div>`).join("");
  }

  itemGrid.addEventListener("click", (e) => {
    if (e.target.dataset.remove !== undefined) { items.splice(e.target.dataset.remove, 1); render(); toast("Removed from homepage"); }
  });

  publishForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const now = new Date();
    const months = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
    const entry = { date: `${String(now.getDate()).padStart(2,"0")} ${months[now.getMonth()]}`, title: itemTitle.value, body: itemBody.value, tag: itemType.value };
    await loadWithFallback(() => Api.publishHomepageItem(entry), null);
    items.unshift(entry);
    render();
    toast("Published to homepage");
    publishForm.reset();
  });

  (async function () {
    items = await loadWithFallback(Api.getAnnouncements, MockDB.announcements.slice());
    render();
  })();
</script>
</body>
</html>
